spring:
  datasource:
    hikari:
      maximum-pool-size: 25
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

notification:
  worker:
    enabled: false
    poll-interval-ms: 500
    batch-size: 20
    lease-seconds: 5
  recovery:
    enabled: false
    interval-ms: 2000
  retry:
    max-attempts: 3
    backoff-seconds: [1, 2, 3]
  circuit-breaker:
    sliding-window-size: 3
    minimum-number-of-calls: 3
    failure-rate-threshold: 50
    wait-duration-in-open-state-seconds: 30

logging:
  level:
    com.example.notification: DEBUG
