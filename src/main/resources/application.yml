spring:
  application:
    name: notification
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification}
    username: ${DB_USER:notification}
    password: ${DB_PASSWORD:notification}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

notification:
  worker:
    enabled: true
    poll-interval-ms: 1000
    batch-size: 20
    lease-seconds: 30
  recovery:
    enabled: true
    interval-ms: 5000
  retry:
    max-attempts: 3
    backoff-seconds: [60, 300, 900]
  circuit-breaker:
    sliding-window-size: 10
    minimum-number-of-calls: 5
    failure-rate-threshold: 50
    wait-duration-in-open-state-seconds: 30

logging:
  level:
    com.example.notification: INFO
